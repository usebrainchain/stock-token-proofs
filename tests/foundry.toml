[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
ast = true
extra_output = ["storageLayout", "metadata"]
auto_detect_remappings = false
allow_paths = ["../onchain"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/halmos-cheatcodes/src/",
  "oz-proxy/=lib/oz-proxy/contracts/",
  "stock/=../onchain/Stock/sources/src/",
  "registry/=../onchain/Registry/sources/src/",
  "../onchain/Registry/sources/:@openzeppelin/contracts/=../onchain/Registry/sources/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts/=../onchain/Stock/sources/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=../onchain/Stock/sources/lib/openzeppelin-contracts-upgradeable/contracts/",
]

[profile.default.fuzz]
runs = 1000
seed = "0x5170c4"

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = false

[profile.mutant]
src = "src"
test = "test"
out = "mutants/.work/out"
cache_path = "mutants/.work/cache"
libs = ["lib"]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
ast = true
extra_output = ["storageLayout", "metadata"]
auto_detect_remappings = false
allow_paths = ["../onchain"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/halmos-cheatcodes/src/",
  "oz-proxy/=lib/oz-proxy/contracts/",
  "stock/=mutants/.work/src/",
  "registry/=../onchain/Registry/sources/src/",
  "../onchain/Registry/sources/:@openzeppelin/contracts/=../onchain/Registry/sources/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts/=../onchain/Stock/sources/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=../onchain/Stock/sources/lib/openzeppelin-contracts-upgradeable/contracts/",
]

[profile.mutant.fuzz]
runs = 256
seed = "0x5170c4"
failure_persist_dir = "mutants/.work/fuzz-failures"

[profile.mutant.invariant]
runs = 64
depth = 250
fail_on_revert = false
failure_persist_dir = "mutants/.work/invariant-failures"
shrink_run_limit = 0

[lint]
lint_on_build = false
